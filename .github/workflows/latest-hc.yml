name: Latest Hot Chocolate

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0

      - name: Upgrade Hot Chocolate packages
        shell: pwsh
        run: .github/workflows/update-hc.ps1

      - name: Test
        env:
          FSHARP_HOTCHOCOLATE_CAPTURE_HANG: '1'
        run: dotnet test -c Release -maxCpuCount --blame-crash --blame-crash-dump-type full --logger trx --results-directory TestResults

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          retention-days: 7
